name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Liberation fonts
        # The gallery is rendered here, and prism measures against these faces.
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --all-extras

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Regenerate the gallery
        # Never publish a gallery that has drifted from the examples.
        run: uv run python scripts/build_gallery.py

      - name: Render the site
        run: uv run quarto render docs

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_site
          force_orphan: true
